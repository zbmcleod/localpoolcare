  <main>
    
  <h1>Contact</h1>

  <p>Need help with your pool? Send us a message and we’ll get back to you soon.</p>
<form action="https://formspree.io/f/xwvgwjqg" method="POST" class="contact-form">
  <div class="form-row">
    <label for="full-name">Full name</label>
    <input id="full-name" name="full-name" type="text" required>
  </div>

  <div class="form-row">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
  </div>

  <div class="form-row two-up">
    <div>
      <label for="mobile">Mobile number</label>
      <input id="mobile" name="mobile" type="tel" required>
    </div>
    <div>
      <label for="location">Location</label>
      <input id="location" name="location" type="text" required>
    </div>
  </div>

  <div class="form-row">
    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>
  </div>

  <div class="form-actions">
    <button type="submit">Send enquiry</button>
  </div>
</form>


  


  </main>
